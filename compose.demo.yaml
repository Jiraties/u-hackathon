# Dedicated local Demo World: public replay on 8082; presenter UI on loopback 8083.
name: fairpass-demo
services:
  web:
    ports: !override
      - '127.0.0.1:8082:8080'
  chain:
    ports: !override
      - '127.0.0.1:18548:8545'
  backend:
    environment:
      FAIRPASS_LOCAL: 'false'
      DEMO_READ_ONLY: 'true'
      TRUST_PROXY_HOPS: '1'
      FAIRPASS_LOAD_DEPLOYMENT: 'true'
      ISSUER_ADDRESS: '0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC'
      DEMO_WORLD_INSTANCE: local-replay-001
      DEMO_REPLAY_MANIFEST: /app/deployments/demo-world.json
      CORS_ORIGIN: http://localhost:8082
  presenter:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      FAIRPASS_LOCAL: 'true'
      FAIRPASS_LOAD_DEPLOYMENT: 'true'
      CHAIN_ID: '31337'
      REGISTRY_VERSION: '2'
      RPC_URL: http://chain:8545
      HOST: 0.0.0.0
      PORT: '3001'
      MONGODB_URI: mongodb://mongo:27017
      ADMIN_API_TOKEN: fairpass-local-admin-token-not-for-public-use
      INTEGRATION_API_TOKEN: fairpass-local-integration-token-not-for-public-use
      ISSUER_API_TOKEN: fairpass-local-issuer-token-not-for-public-use
      DEMO_PASSWORD: password
      DEMO_WORLD_INSTANCE: local-replay-001
      CORS_ORIGIN: http://localhost:8083
      INSTITUTION_NAME: Kasetsart University
    volumes:
      - deployments:/app/deployments:ro
    depends_on:
      mongo:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, docker/health.mjs, api]
      interval: 15s
      timeout: 12s
      retries: 5
  presenter-web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - '127.0.0.1:8083:8080'
    volumes:
      - ./docker/presenter-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      presenter:
        condition: service_healthy
  tools:
    environment:
      DEMO_WORLD_INSTANCE: local-replay-001
      DEMO_REPLAY_MANIFEST: /app/deployments/demo-world.json
      API_URL: http://presenter:3001
    command: [dist/scripts/prepare-demo-world-local.js]
